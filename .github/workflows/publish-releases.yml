name: Publish GitHub Release

on:
  push:
    branches:
      - main
    paths:
      - metadata.yaml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-github-release
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish latest release
    if: github.repository == 'facebook/GoogleTagManager-WebTemplate-For-FacebookPixel'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read latest release from metadata.yaml
        id: release
        run: |
          ruby -ryaml <<'RUBY'
          metadata = YAML.safe_load(File.read('metadata.yaml'), aliases: false)
          entry = metadata.fetch('versions').first
          notes = entry.fetch('changeNotes').to_s.strip
          match = notes.match(/\Av?(\d+\.\d+\.\d+)\b/)
          abort 'The first metadata.yaml entry must start with a semantic version' unless match

          version = match[1]
          sha = entry.fetch('sha').to_s
          abort "Invalid GitHub SHA for v#{version}: #{sha}" unless sha.match?(/\A[0-9a-f]{40}\z/)

          File.open(ENV.fetch('GITHUB_OUTPUT'), 'a') do |output|
            output.puts "version=#{version}"
            output.puts "sha=#{sha}"
          end

          notes_path = File.join(ENV.fetch('RUNNER_TEMP'), 'release-notes.md')
          File.write(notes_path, notes.sub(/\Av?#{Regexp.escape(version)}\s*/, ''))
          RUBY

      - name: Validate and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.release.outputs.sha }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          tag="v${VERSION}"
          git cat-file -e "${SHA}^{commit}"

          template_version=$(git show "${SHA}:template.tpl" |
            sed -nE "s/^const version = '([^']+)';$/\1/p")
          if [[ "$template_version" != "$VERSION" ]]; then
            echo "::error::metadata.yaml says v${VERSION}, but template.tpl at ${SHA} says v${template_version}"
            exit 1
          fi

          tag_args=(--target "$SHA")
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            tag_sha=$(git rev-list -n 1 "$tag")
            if [[ "$tag_sha" != "$SHA" ]]; then
              echo "::error::Existing tag ${tag} targets ${tag_sha}, expected ${SHA}"
              exit 1
            fi
            tag_args=(--verify-tag)
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; marking it as latest."
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --latest
            exit 0
          fi

          asset_name="facebook-pixel-gtm-template-${VERSION}.tpl"
          asset_path="${RUNNER_TEMP}/${asset_name}"
          git show "${SHA}:template.tpl" > "$asset_path"

          gh release create "$tag" "$asset_path" \
            --repo "$GITHUB_REPOSITORY" \
            "${tag_args[@]}" \
            --title "Release ${VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest
